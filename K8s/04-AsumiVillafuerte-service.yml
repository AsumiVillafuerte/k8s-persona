apiVersion: v1
kind: Service
metadata:
  name: asumivillafuerte-api-service
  namespace: asumivillafuerte-api-ns
  labels:
    app: asumivillafuerte-api
spec:
  selector:
    app: asumivillafuerte-api
  type: NodePort
  ports:
    - port: 8085
      protocol: TCP
      targetPort: 8085
      nodePort: 30080